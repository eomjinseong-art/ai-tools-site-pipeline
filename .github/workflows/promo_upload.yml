name: Promo Shorts - Daily Publish

# Retired in-repo. Keep this file name and workflow name so GitHub workflow
# 341500131 stays the already disabled workflow instead of a new active one.
# Do not add a schedule. Do not render cards or upload from this file.
# Do not re-enable this workflow.
# A manual dispatch fails closed and does not render or upload.
# The beige/pastel 9-card carousel is a separate pipeline and is not this file.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse legacy black-card Shorts
        run: |
          echo "Legacy black-card Shorts are retired (레거시 검정 카드 쇼츠는 중단됨)."
          echo "This workflow no longer renders cards or uploads to YouTube."
          echo "It must not be re-enabled. Schedule and template fallbacks are not a bypass."
          echo "The beige/pastel 9-card carousel is a separate pipeline and is not this workflow."
          echo "Reactivation requires explicit new design permission and a new code change."
          exit 1
