name: Promo Shorts - Daily Publish

on:
  schedule:
    - cron: "0 23 * * *" # 08:00 KST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore promo state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/promo_shorts_state.json
            out/content_queue_state.json
          key: promo-shorts-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            promo-shorts-state-
            promo-shorts-state

      - name: Report script queue days left
        run: python -m content_queue status --outdir out

      - name: Publish daily Short
        env:
          # Paid LLM/TTS keys are not used.
          # invalid_grant opens/updates issue "유튜브 로그인 다시 필요".
          # days_left < 14 opens/updates issue "쇼츠 대본 대기열 부족".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EDGE_TTS_VOICE: ko-KR-SunHiNeural
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EXPECTED_YOUTUBE_CHANNEL_ID: ${{ secrets.EXPECTED_YOUTUBE_CHANNEL_ID }}
        run: python promo_pipeline.py --outdir out

      - name: Record consumed script ids
        if: success()
        continue-on-error: true
        run: |
          if [[ ! -f content_queue/consumed_ids.json ]]; then
            echo "no consumed state file"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_queue/consumed_ids.json
          if git diff --cached --quiet; then
            echo "consumed ids unchanged"
            exit 0
          fi
          git commit -m "chore: record consumed shorts script id"
          git push origin HEAD

      - name: Save promo state cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            out/promo_shorts_state.json
            out/content_queue_state.json
          key: promo-shorts-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-out
          path: |
            out/final.mp4
            out/thumbnail.jpg
            out/metadata.json
            out/cards.json
            out/script.json
            out/queue_status.json
            out/upload.json
            out/youtube_auth_error.json
            out/skipped.json
            out/source_video.json
            out/promo_shorts_state.json
            out/content_queue_state.json
          if-no-files-found: warn

      - name: Fail if publish did not complete
        if: success()
        run: |
          if [[ -f out/skipped.json ]]; then
            echo "No eligible collector video today; not treating as a false-green upload."
            exit 0
          fi
          if [[ ! -f out/final.mp4 ]]; then
            echo "final.mp4 missing — render did not finish."
            exit 1
          fi
          if [[ ! -f out/upload.json ]]; then
            echo "upload.json missing — YouTube upload did not finish."
            exit 1
          fi
          python - <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path("out/upload.json").read_text(encoding="utf-8"))
          if data.get("skipped"):
              print("upload skipped unexpectedly in scheduled job")
              sys.exit(1)
          if not data.get("youtube_id"):
              print("upload.json has no youtube_id")
              sys.exit(1)
          print("uploaded", data["youtube_id"])
          PY
