name: Promo Shorts - Daily Publish

on:
  schedule:
    - cron: "0 23 * * *" # 08:00 KST
  workflow_dispatch:

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Restore promo state cache
        uses: actions/cache@v4
        with:
          path: out/promo_shorts_state.json
          key: promo-shorts-state
          restore-keys: |
            promo-shorts-state

      - name: Publish daily Short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          REWRITE_MODEL: ${{ secrets.REWRITE_MODEL }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          EXPECTED_YOUTUBE_CHANNEL_ID: ${{ secrets.EXPECTED_YOUTUBE_CHANNEL_ID }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: python promo_pipeline.py --outdir out

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-out
          path: |
            out/final.mp4
            out/thumbnail.jpg
            out/metadata.json
            out/cards.json
            out/upload.json
            out/skipped.json
            out/source_video.json
            out/promo_shorts_state.json
          if-no-files-found: warn

      - name: Fail if publish did not complete
        if: success()
        run: |
          if [[ -f out/skipped.json ]]; then
            echo "No eligible collector video today; not treating as a false-green upload."
            exit 0
          fi
          if [[ ! -f out/final.mp4 ]]; then
            echo "final.mp4 missing — render did not finish."
            exit 1
          fi
          if [[ ! -f out/upload.json ]]; then
            echo "upload.json missing — YouTube upload did not finish."
            exit 1
          fi
          python - <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path("out/upload.json").read_text(encoding="utf-8"))
          if data.get("skipped"):
              print("upload skipped unexpectedly in scheduled job")
              sys.exit(1)
          if not data.get("youtube_id"):
              print("upload.json has no youtube_id")
              sys.exit(1)
          print("uploaded", data["youtube_id"])
          PY
