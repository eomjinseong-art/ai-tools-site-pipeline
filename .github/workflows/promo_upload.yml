# 예시: .github/workflows/promo_upload.yml
name: Promo Shorts - Rewrite & Render (GitHub Actions)

on:
  schedule:
    - cron: '0 23 * * *'  # KST 8:00
  workflow_dispatch:

jobs:
  promo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests pillow google-auth google-api-python-client google-auth-httplib2 google-cloud-storage

      - name: Run promo orchestrator (rewrite only)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_VOICE_ID: ${{ secrets.ELEVEN_VOICE_ID }}
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GCS_SERVICE_ACCOUNT: ${{ secrets.GCS_SERVICE_ACCOUNT }}
        run: |
          python rewrite_driver.py

# 주의:
# - 이 워크플로는 예시입니다. 실제 repo에선 rewrite_driver.py (또는 orchestrator) 파일을 만들어
#   리라이팅 → 카드 생성 → TTS → 렌더/업로드를 연결하세요.
# - 민감한 서비스 계정 JSON은 GitHub Secrets에 반드시 "single-line" 혹은 base64로 넣어주세요.
